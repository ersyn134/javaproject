spring.application.name=videogamelibrary
spring.datasource.url=jdbc:postgresql://localhost:5432/videogame_library
spring.datasource.username=yersin
spring.datasource.password=witcher3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health,info,metrics,logfile
management.endpoint.health.show-details=always

# Redis для кэширования
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Для отладки кэша (опционально)
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG